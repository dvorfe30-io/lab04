name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Test hello_world
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/hello_world_application/Debug/hello_world_application.exe
          else
            ./build/hello_world_application/hello_world_application
          fi

      - name: Test solver
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "1 -2 1" | ./build/solver_application/Debug/solver_application.exe
          else
            echo "1 -2 1" | ./build/solver_application/solver_application
          fi
